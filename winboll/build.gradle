// =====================================================================
// WinBoLL 模块构建脚本
// 工具链随 WinBoLL 框架：AGP 7.2.1 + Gradle 7.5.1。
// 版本/签名/渠道/lint/打包排除逻辑内联自 .winboll/winboll_app_build.gradle
// 与 .winboll/winboll_lint_build.gradle（AGP 7 下使用 packagingOptions/lintOptions）。
// =====================================================================

apply plugin: 'com.android.application'

// -------- 版本信息：读自模块根 build.properties --------
def propsFile = file('build.properties')
def props = new Properties()
if (propsFile.exists()) {
    propsFile.withInputStream { props.load(it) }
}
def baseVersion = props.getProperty('baseVersion', '15.22')
def stageCount = props.getProperty('stageCount', '0')
def buildCount = props.getProperty('buildCount', '0')
def winbollVersionName = "${baseVersion}.${stageCount}"

// -------- 签名配置：root 下存在 appkey.keystore 时启用 --------
def keyPropsFile = rootProject.file('appkey.keystore')

android {
    compileSdk 30
    // 该 SDK 中仅 30.0.3 / 35.0.0 / 36.0.0 含 Windows 版 build-tools
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId 'cc.winboll.studio.winboll'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName winbollVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        if (keyPropsFile.exists()) {
            winboll {
                def keyProps = new Properties()
                keyPropsFile.withInputStream { keyProps.load(it) }
                assert keyProps['keyAlias'] != null \
                        && keyProps['keyPassword'] != null \
                        && keyProps['storeFile'] != null \
                        && keyProps['storePassword'] != null
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keyPropsFile.exists()) {
                signingConfig signingConfigs.winboll
            }
        }
        release {
            if (keyPropsFile.exists()) {
                signingConfig signingConfigs.winboll
            }
            minifyEnabled true          // 混淆（主开关）
            shrinkResources true        // 移除未使用资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    // 保留原 WinBoLL 的 beta / stage 双渠道
    flavorDimensions 'WinBoLLApp'
    productFlavors {
        beta {
            dimension 'WinBoLLApp'
            applicationIdSuffix '.beta'
            versionNameSuffix "-beta${buildCount}"
        }
        stage {
            dimension 'WinBoLLApp'
        }
    }

    packagingOptions {
        // 不要排除 META-INF/NOTICE.md 或 META-INF/LICENSE.md：Apache/MIT/BSD/EPL
        // 许可要求随产物分发许可文本与 NOTICE；按文件名剔除会去掉上游署名。
        // 以下 4 个是 fastjson 1.2.76 内置的 JAX-RS/Jersey 可选集成 service 注册文件，
        // 对应实现类不在 classpath，属死服务注册，排除以消除 R8 "missing service class" 警告。
        exclude 'META-INF/services/javax.ws.rs.ext.MessageBodyReader'
        exclude 'META-INF/services/javax.ws.rs.ext.MessageBodyWriter'
        exclude 'META-INF/services/javax.ws.rs.ext.Providers'
        exclude 'META-INF/services/org.glassfish.jersey.internal.spi.AutoDiscoverable'
    }

    lintOptions {
        abortOnError false
        checkAllWarnings true
        showAll true
        checkReleaseBuilds true
        xmlReport true
        htmlReport true
    }
}

dependencies {
    // 许可合规（2026-11-15）：以下两族构件由 cc.winboll.studio:libappbase / libaes
    // 传递引入，但本应用及两库自身代码均未引用，排除后 APK 不携带任何 LGPL/EPL 代码：
    //  - com.github.open-android:pinyin4j 内含 com.hp.hpl.sparta（LGPL-2.1）
    //  - com.sun.mail:android-mail / android-activation（EPL-2.0）
    configurations.all {
        exclude group: 'com.github.open-android', module: 'pinyin4j'
        exclude group: 'com.sun.mail'
    }

    api 'com.google.code.gson:gson:2.10.1'

    // 下拉刷新控件
    api 'com.baoyz.pullrefreshlayout:library:1.2.0'

    // SSH
    api 'com.jcraft:jsch:0.1.55'
    // HTML 解析
    api 'org.jsoup:jsoup:1.13.1'
    // 二维码
    api 'com.google.zxing:core:3.4.1'
    api 'com.journeyapps:zxing-android-embedded:3.6.0'
    // 关于页
    api 'io.github.medyo:android-about-page:2.0.0'
    // 网络
    api 'com.squareup.okhttp3:okhttp:4.4.1'
    // FastJSON
    implementation 'com.alibaba:fastjson:1.2.76'

    api 'androidx.recyclerview:recyclerview:1.0.0'
    api 'com.github.bumptech.glide:glide:4.9.0'

    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.google.guava:guava:24.1-jre'

    // Termux 终端不打包：通过 RUN_COMMAND Intent 调用独立 App，不链接 GPL-3.0 代码
    // 生物识别（指纹）
    implementation 'androidx.biometric:biometric:1.1.0'

    // WinBoLL 私有库（nexus.winboll.cc）：锁定版本，避免动态版本破坏许可合规结论
    api 'cc.winboll.studio:libappbase:15.22.7'
    api 'cc.winboll.studio:libaes:15.22.7'

    // 本地 jar 兜底
    api fileTree(dir: 'libs', include: ['*.jar'])
}
