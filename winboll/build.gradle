apply plugin: 'com.android.application'
apply from: '../.winboll/winboll_app_build.gradle'
apply from: '../.winboll/winboll_lint_build.gradle'

def genVersionName(def versionName){
    // Check build flag configuration
    assert (winbollBuildProps['stageCount'] != null)
    assert (winbollBuildProps['baseVersion'] != null)
    // Save base version
    winbollBuildProps.setProperty("baseVersion", "${versionName}");
    // Save build flag configuration
    FileOutputStream fos = new FileOutputStream(winbollBuildPropsFile)
    winbollBuildProps.store(fos, "${winbollBuildPropsDesc}");
    fos.close();

    // Return assembled version name
    return "${versionName}." + winbollBuildProps['stageCount']
}

android {
 	// Compatible with MIUI12
     compileSdkVersion 30

     compileOptions {
         sourceCompatibility JavaVersion.VERSION_1_7
         targetCompatibility JavaVersion.VERSION_1_7
     }

    defaultConfig {
        applicationId "cc.winboll.studio.winboll"
        minSdkVersion 26
		// Compatible with MIUI12
        targetSdkVersion 30
        versionCode 1
        // After updating versionName, manually set stageCount=0
        // in the .winboll/winbollBuildProps.properties file.
        // The combined versionName under the Gradle build is "${versionName}.0"
        versionName "15.21"
        if(true) {
            versionName = genVersionName("${versionName}")
        }
    }

    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
    }
}

dependencies {
    api 'com.google.code.gson:gson:2.10.1'

	// Pull-to-refresh widget
    api 'com.baoyz.pullrefreshlayout:library:1.2.0'

    // SSH
    api 'com.jcraft:jsch:0.1.55'
    // HTML parsing
    api 'org.jsoup:jsoup:1.13.1'
    // QR code libraries
    api 'com.google.zxing:core:3.4.1'
    api 'com.journeyapps:zxing-android-embedded:3.6.0'
    // About-page library
    api 'io.github.medyo:android-about-page:2.0.0'
	// Networking library
    api 'com.squareup.okhttp3:okhttp:4.4.1'
     // FastJSON parsing
     implementation 'com.alibaba:fastjson:1.2.76'

	// AndroidX libraries
    /*api 'androidx.appcompat:appcompat:1.1.0'
    //api 'com.google.android.material:material:1.4.0'
    //api 'androidx.viewpager:viewpager:1.0.0'
    //api 'androidx.vectordrawable:vectordrawable:1.1.0'
    //api 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
    //api 'androidx.fragment:fragment:1.1.0'*/


	// MiMo ad SDK
	//api 'com.miui.zeus:mimo-ad-sdk:5.3.+'// please use the latest SDK
     // Note: the following 5 libraries are required
    //implementation 'androidx.appcompat:appcompat:1.4.1'
    api 'androidx.recyclerview:recyclerview:1.0.0'
    api 'com.github.bumptech.glide:glide:4.9.0'
    //annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

	implementation "androidx.annotation:annotation:1.3.0"
    implementation "androidx.core:core:1.6.0"
    implementation "androidx.drawerlayout:drawerlayout:1.1.1"
    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "com.google.android.material:material:1.4.0"
    implementation "com.google.guava:guava:24.1-jre"
    /*
	implementation "io.noties.markwon:core:$markwonVersion"
    implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
    implementation "io.noties.markwon:linkify:$markwonVersion"
    implementation "io.noties.markwon:recycler:$markwonVersion"
	*/
	// Termux terminal is NOT bundled: it runs in a separate standalone Termux app
	// and is only invoked through the RUN_COMMAND Intent interface (see
	// TermuxCommandExecutor), so no com.termux GPL-3.0 libraries are linked here.

	// Biometric (fingerprint) recognition
	implementation 'androidx.biometric:biometric:1.1.0'

	// WinBoLL libraries from nexus.winboll.cc
    api 'cc.winboll.studio:libappbase:15.21.+'
    api 'cc.winboll.studio:libaes:15.21.+'

	// Fallback libraries from jitpack.io
	//api 'com.github.ZhanGSKen:libappbase:appbase-v15.21.+'
	//api 'com.github.ZhanGSKen:libaes:aes-v15.21.+'

	api fileTree(dir: 'libs', include: ['*.jar'])
}
