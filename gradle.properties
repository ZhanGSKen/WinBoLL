# =====================================================================
# WINBOT 主机安卓项目开发模板 — Gradle 全局配置
# =====================================================================
# JVM 参数：2G 堆 + UTF-8 编码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 并行构建（多模块时加速）
org.gradle.parallel=true
# 构建缓存
org.gradle.caching=true
# AndroidX
android.useAndroidX=true
# winboll 模块代码（如 AboutActivity 的 R.drawable.ic_winboll）直接引用
# libaes / libappbase 库资源，需 App 的 R 合并库资源，故关闭非传递 R 类。
android.nonTransitiveRClass=false
# winboll 的第三方库（solid support 库系，如 support-compat）需重写为 AndroidX，
# 否则与 androidx.core 产生重复类（checkDebugDuplicateClasses 失败）。
android.enableJetifier=true
# 项目目录含中文，绕过 AGP 路径检查（必须，否则拒绝编译）
android.overridePathCheck=true
