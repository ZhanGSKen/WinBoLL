apply plugin: 'com.android.application'
apply from: '../.winboll/winboll_app_build.gradle'
apply from: '../.winboll/winboll_lint_build.gradle'

def genVersionName(def versionName){
    // 检查编译标志位配置
    assert (winbollBuildProps['stageCount'] != null)
    assert (winbollBuildProps['baseVersion'] != null)
    // 保存基础版本号
    winbollBuildProps.setProperty("baseVersion", "${versionName}");
    //保存编译标志配置
    FileOutputStream fos = new FileOutputStream(winbollBuildPropsFile)
    winbollBuildProps.store(fos, "${winbollBuildPropsDesc}");
    fos.close();
    
    // 返回编译版本号
    return "${versionName}." + winbollBuildProps['stageCount']
}

android {
	// 适配MIUI12
	compileSdkVersion 30
    buildToolsVersion "30.0.3"
	
    defaultConfig {
        applicationId "cc.winboll.studio.appbase"
        minSdkVersion 26
        targetSdkVersion 30
		//1. Android 官方规则
		//-  versionCode  类型：int 整型
		//- Java int 最大值：2147483647
        versionCode 1520000
        // versionName 更新后需要手动设置 
        // .winboll/winbollBuildProps.properties 文件的 stageCount=0
        // Gradle编译环境下合起来的 versionName 就是 "${versionName}.0"
        versionName "15.21"
        if(true) {
            versionName = genVersionName("${versionName}")
        }
    }
	
     // 确保 Java 7 兼容性（已适配项目技术栈）
     compileOptions {
         sourceCompatibility JavaVersion.VERSION_1_7
         targetCompatibility JavaVersion.VERSION_1_7
     }
     packagingOptions {
         exclude 'META-INF/LICENSE.md'
         exclude 'META-INF/LICENSE.txt'
         exclude 'META-INF/NOTICE.md'
         exclude 'META-INF/NOTICE.txt'
     }
}

dependencies {
    api project(':libappbase')
	
	// WinBoLL库 nexus.winboll.cc 地址
    //api 'cc.winboll.studio:libappbase:15.20.+'
    api 'cc.winboll.studio:libaes:15.20.21'
    api 'androidx.appcompat:appcompat:1.3.1'
    // JavaMail SMTP (Android兼容版)
    api 'com.sun.mail:android-mail:1.6.7'
    api 'com.sun.mail:android-activation:1.6.7'
	
    api fileTree(dir: 'libs', include: ['*.jar'])
}
