// =====================================================================
// WINBOT 主机安卓项目开发模板 — 项目设置
// 派生新项目时：修改 rootProject.name，按需 include 新模块。
// =====================================================================
pluginManagement {
    repositories {
        // 阿里云镜像（国内加速，优先）
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
        // WinBoLL Nexus 私服（公司私有构件）
        maven { url 'https://nexus.winboll.cc/repository/maven-public/' }
        maven { url 'https://nexus.winboll.cc/repository/maven-snapshots/' }
        // 官方仓库兜底
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // 采用 WinBoLL 框架根脚本（allprojects 仓库）后，仓库由各工程自行声明；
    // 此处保留 settings 侧仓库作为兜底，不再强制 FAIL_ON_PROJECT_REPOS。
    repositories {
        // 阿里云镜像（国内加速，优先）
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        // WinBoLL Nexus 私服（公司私有构件）
        maven { url 'https://nexus.winboll.cc/repository/maven-public/' }
        maven { url 'https://nexus.winboll.cc/repository/maven-snapshots/' }
        // 官方仓库兜底
        google()
        mavenCentral()
    }
}

rootProject.name = "ClaudeCode"
include ':claudecode'
