// =====================================================================
// ClaudeCodeAndroid — claudecode 模块构建脚本
// 工具链随 WinBoLL 框架：AGP 7.2.1 + Gradle 7.5.1（AGP 7 不支持 namespace DSL，
// 包名回到 AndroidManifest 的 package 属性）。
// =====================================================================
apply plugin: 'com.android.application'

android {
    compileSdk 30
    // 该 SDK 中仅 30.0.3 / 35.0.0 / 36.0.0 含 Windows 版 build-tools
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId 'cc.winboll.studio.claudecodeandroid'
        minSdk 24
        targetSdk 30
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
