        // Note: GitHub packaging uses the "bash ./gradlew assembleBetaRelease" command in android.yml
        //
        if(variant.flavorName == "beta" && variant.buildType.name == "release") {
            /* Reserved for future management */
            /* No GitHub APK output configuration needed for now */
            /* Ignore the GitHub section */
        }

        //
        // WinBoLL APK output configuration
        // 1. Configure Stage Release APK output
        // 2. Configure Beta Debug APK output
	    //
        if((variant.flavorName == "beta" && variant.buildType.name == "debug")
        || (variant.flavorName == "beta" && variant.buildType.name == "release")
        || (variant.flavorName == "stage" && variant.buildType.name == "debug")
        || (variant.flavorName == "stage" && variant.buildType.name == "release")) {
