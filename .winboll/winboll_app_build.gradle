// WinBoLL app signing configuration
//

// ===== BaseVersion.flag version gate =====
// Before creating/writing a module's build.properties, compare its baseVersion
// value with the version set in BaseVersion.flag (project root):
//   equal   -> skip the gate, follow the original rules
//   less    -> the written build.properties gets stageCount=0, buildCount=0,
//              baseVersion=<flag>, publishVersion=<flag>.0, baseBetaVersion=<flag>.1
//              (other properties unchanged), then it is copied to every module
//              folder enabled in settings.gradle
//   greater -> assert and abort the build
def winbollCompareVersions = { String a, String b ->
    def pa = (a ?: "0").split("\\.").collect { it.isInteger() ? it.toInteger() : 0 }
    def pb = (b ?: "0").split("\\.").collect { it.isInteger() ? it.toInteger() : 0 }
    int n = Math.max(pa.size(), pb.size())
    for (int i = 0; i < n; i++) {
        int va = i < pa.size() ? pa[i] : 0
        int vb = i < pb.size() ? pb[i] : 0
        if (va != vb) return va < vb ? -1 : 1
    }
    return 0
}

def winbollCopyBuildPropsToAllModules = {
    File settingsFile = new File("${RootProjectDir}/settings.gradle")
    if (!settingsFile.exists()) {
        println ">>> BaseVersion gate: settings.gradle not found, skip build.properties copy."
        return
    }
    settingsFile.eachLine { String line ->
        // Strip trailing comments so only real include statements are parsed
        String code = line.split("//", 2)[0]
        String trimmed = code.trim()
        if (!trimmed.startsWith("include")) return
        if (trimmed.startsWith("includeBuild")) return
        def matcher = (code =~ /['"]:([^'"]+)['"]/)
        while (matcher.find()) {
            String moduleName = matcher.group(1)
            File moduleDir = new File("${RootProjectDir}/${moduleName}")
            if (moduleDir.isDirectory()) {
                File targetFile = new File(moduleDir, "build.properties")
                if (targetFile.canonicalFile == winbollBuildPropsFile.canonicalFile) {
                    // The source build.properties itself, nothing to copy.
                } else {
                    java.nio.file.Files.copy(winbollBuildPropsFile.toPath(), targetFile.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    println ">>> BaseVersion gate: build.properties copied to module folder: " + moduleName
                }
            }
        }
    }
}

// Returns 'equal' or 'adjusted'; asserts and aborts when baseVersion > BaseVersion.flag.
def winbollBaseVersionFlagCheck = {
    File flagFile = new File("${RootProjectDir}/BaseVersion.flag")
    if (!flagFile.exists()) {
        println ">>> BaseVersion gate: BaseVersion.flag not found, gate skipped."
        return 'equal'
    }
    String flagVersion = flagFile.text.trim()
    assert !flagVersion.isEmpty() : ">>> BaseVersion gate ERROR: BaseVersion.flag is empty! Build aborted."
    String baseVersion = winbollBuildProps['baseVersion']
    int cmp = winbollCompareVersions(baseVersion, flagVersion)
    println ">>> BaseVersion gate: build.properties baseVersion=" + baseVersion + " BaseVersion.flag=" + flagVersion
    if (cmp == 0) {
        println ">>> BaseVersion gate: equal, skip."
        return 'equal'
    }
    assert cmp < 0 : ">>> BaseVersion gate ERROR: baseVersion " + baseVersion + " is greater than BaseVersion.flag " + flagVersion + " ! Update BaseVersion.flag first. Build aborted."
    winbollBuildProps.setProperty("stageCount", "0")
    winbollBuildProps.setProperty("buildCount", "0")
    winbollBuildProps.setProperty("baseVersion", flagVersion)
    winbollBuildProps.setProperty("publishVersion", flagVersion + ".0")
    winbollBuildProps.setProperty("baseBetaVersion", flagVersion + ".1")
    println ">>> BaseVersion gate: baseVersion " + baseVersion + " < BaseVersion.flag " + flagVersion + ", build.properties adjusted (stageCount=0, buildCount=0, baseVersion=" + flagVersion + ", publishVersion=" + flagVersion + ".0, baseBetaVersion=" + flagVersion + ".1)."
    return 'adjusted'
}

android {
	def winbollProps = new Properties()
